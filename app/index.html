<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue-Green Demo</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: __COLOR__;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  h1 { font-size: clamp(2.5rem, 12vw, 7rem); margin: 0; text-transform: uppercase; }
  p { font-size: clamp(1.2rem, 4vw, 2rem); margin: 0.5rem 0 0; }
</style>
</head>
<body>
<h1>__COLOR__</h1>
<p>Application version __VERSION__</p>
</body>
</html>
